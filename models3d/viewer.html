const poiByName = n => POI && POI.pois.find(p => p.name === n);

  const P = $('panel'); P.hidden = false;
  P.innerHTML = `<button type="button" class="x" aria-label="${esc3(PT.close)}">✕</button><div class="k">${esc3(PT.kind[p.kind] || '')}</div><h2>${esc3(p.name)}</h2>${wikiBlock(p)}<div class="src">${esc3(PT.src)}${p.desc && p.desc[LANG] ? ' ' + esc3(PT.wdsrc) + '.' : ''}</div>`;

function flyTo(tgt, cam) {   // eased move of target and camera; a drag stops it

  if (fly) {

  const w = innerWidth, h = innerHeight, v = new THREE.Vector3(), occ = (++occT % 12) === 0, placed = [];
  for (const [p, b] of poiEls) {   // in rank order (build_pois.py sorts castles, gates and churches first): a label that would overlap one already placed waits
    v.copy(p.pos).project(camera); const d = camera.position.distanceTo(p.pos);
    const near = MAJOR.has(p.kind) ? d < 1600 : d < 420;
    let show = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && near;
    if (show && occ) {   // hidden behind a hill or a building: checked every few frames

    show = show && (!b.dataset.occ || b.classList.contains('sel'));

    if (show) {
      const bw = b._w || (b._w = Math.min(230, p.name.length * 6.6 + 20)), r = [sx - bw / 2 - 3, sy - 38, sx + bw / 2 + 3, sy - 14];
      if (!b.classList.contains('sel') && placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) show = false; else placed.push(r);

}

// ---------- film mode (7 Nov 2026): viewer.html?m=<slug>&film=1 for tools/model3d/film.mjs ----------
// No controls; the camera follows the tour stops listed in pois.json "film" (default: all stops) on a smooth curve, each stop
// named in a caption as the camera passes it; the illustrative-model label and the credits stay on every frame.
// The recorder calls m3dFilm.renderAt(seconds) once per frame, so motion does not depend on how fast the machine renders.
const FILM = q.has('film');
let filmPath = null;
if (FILM) {
  document.body.classList.add('film');
  const st = document.createElement('style');
  st.textContent = `body.film #top, body.film #bottom, body.film #pois, body.film #panel { display: none !important; }
    #filmUI { position: absolute; inset: 0; pointer-events: none; font-family: system-ui, "Segoe UI", sans-serif; }
    #filmUI::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    #filmUI .cap { position: absolute; left: 5%; bottom: 13%; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.65); transition: none; }
    #filmUI .cap b { display: block; font-size: calc(min(100vw, 100vh) * 0.06); font-weight: 650; letter-spacing: .01em; }
    #filmUI .cap span { display: block; font-size: calc(min(100vw, 100vh) * 0.028); opacity: .9; }
    #filmUI .lab { position: absolute; left: 5%; right: 5%; bottom: 4.5%; color: rgba(255,255,255,.88); font-size: calc(min(100vw, 100vh) * 0.019); text-shadow: 0 1px 4px rgba(0,0,0,.8); }
    #filmUI .lab b { color: #fff; }`;
  document.head.appendChild(st);
  const ui = document.createElement('div'); ui.id = 'filmUI';
  ui.innerHTML = `<div class="cap" id="filmCap"><b></b><span></span></div><div class="lab"><b>${esc3((T.note.match(/<b>(.*?)<\/b>/) || [0, ''])[1].replace(/\.$/, ''))}</b> · ${esc3(M.credit)}</div>`;
  document.body.appendChild(ui);
}
function filmBuild() {   // camera and target curves through the chosen stops; vertical frames sit a little further back
  const T_ = (POI && POI.tour) || [], pick = (POI && POI.film && POI.film.stops) || T_.map((_, i) => i), back = innerHeight > innerWidth ? 1.35 : 1.0;
  const keys = pick.map(i => T_[i]).filter(Boolean).map(s => {
    const tgt = s.pos.clone().setY(s.pos.y + 6), cam = new THREE.Vector3(s.cam[0], groundAt(s.cam[0], -s.cam[2]) + s.cam[1], -s.cam[2]);
    return { s, tgt, cam: tgt.clone().add(cam.clone().sub(tgt).multiplyScalar(back)) };

  const post = { tgt: kN.tgt.clone(), cam: kN.tgt.clone().add(kN.cam.clone().sub(kN.tgt).multiplyScalar(1.3)).add(new THREE.Vector3(0, 40, 0)) };
  const all = [pre, ...keys, post];

    cam: new THREE.CatmullRomCurve3(all.map(k => k.cam), false, 'centripetal'), tgt: new THREE.CatmullRomCurve3(all.map(k => k.tgt), false, 'centripetal') };

const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
window.m3dFilm = {
  ready: false,
  info() { return filmPath ? { seconds: filmPath.dur, stops: filmPath.keys.map(k => k.s.name) } : null; },
  stopTime(k) {   // the second at which the flight passes stop k (curve point k + 1), found by bisection through the easing

  },
};

// ---------- loop ----------
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();

  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w, h);
  const pr = renderer.getPixelRatio(); reflRT.setSize(Math.round(w * pr / (small ? 3 : 2)), Math.round(h * pr / (small ? 3 : 2)));
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const t0 = performance.now();

}
resize(); applyMood(); resetView(); if (FILM) controls.autoRotate = false; if (q.get('q') === 'low') setQuality(2); requestAnimationFrame(frame);
