<style>

const M = SLUG ? await m3dGet(`${SLUG}.json`, 'json').catch(() => null) : null;

// ---------- moods ----------

  day: { sunEl: 55, sunCol: [1, 0.97, 0.9], sunI: 2.4, hemi: 1.0, env: 0.7, exposure: 0.8, horizon: [0.55, 0.62, 0.7], zenith: [0.16, 0.28, 0.52], glow: [0.2, 0.18, 0.15], fogN: 1500, fogF: 40000, rain: 0.5, lamps: 0.1, windows: 0.1 },
  golden: { sunEl: 9, sunCol: [1, 0.66, 0.36], sunI: 2.2, hemi: 0.55, env: 0.45, exposure: 0.95, horizon: [0.62, 0.46, 0.32], zenith: [0.14, 0.19, 0.34], glow: [0.9, 0.45, 0.18], fogN: 1200, fogF: 30000, rain: 0.6, lamps: 0.4, windows: 0.5 },
  dusk: { sunEl: -4, sunCol: [0.6, 0.5, 0.45], sunI: 0, hemi: 0.45, env: 0.32, exposure: 1.05, horizon: [0.13, 0.15, 0.16], zenith: [0.045, 0.055, 0.065], glow: [0.16, 0.1, 0.06], fogN: 600, fogF: 14000, rain: 1, lamps: 1, windows: 1 },
  night: { sunEl: -20, sunCol: [0.5, 0.55, 0.7], sunI: 0.15, hemi: 0.3, env: 0.3, exposure: 1.2, horizon: [0.04, 0.05, 0.06], zenith: [0.006, 0.009, 0.014], glow: [0.04, 0.025, 0.015], fogN: 800, fogF: 18000, rain: 0.8, lamps: 1, windows: 1.1 },

// ---------- renderer, scene, sky ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 30000);
const SKY_GLSL = `
uniform vec3 uHorizon, uZenith, uGlow, uGlowDir;
vec3 skyCol(vec3 r) {
  vec3 c = mix(uHorizon, uZenith, smoothstep(-0.02, 0.6, r.y));
  float az = max(dot(normalize(vec3(r.x, 0.0, r.z) + 1e-5), uGlowDir), 0.0);

const skyU = { uHorizon: { value: new THREE.Color() }, uZenith: { value: new THREE.Color() }, uGlow: { value: new THREE.Color() }, uGlowDir: { value: new THREE.Vector3(...M.glow).normalize() } };

  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = (modelMatrix * vec4(position, 1.0)).xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); gl_Position.z = gl_Position.w * 0.99999; }`,

}));

const hemi = new THREE.HemisphereLight(0x7d93c4, 0x1c2030, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1); sun.castShadow = true; sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);

const sunDir = new THREE.Vector3();

  const el = THREE.MathUtils.degToRad(Math.max(mood.sunEl, 4)), g = skyU.uGlowDir.value;

// ---------- water with planar reflection (glacial green) ----------
const reflRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });

});

const waveH = (x, z, t) => WAVES.reduce((y, w) => y + w.a * Math.sin(w.k * (w.dx * x + w.dz * z) - w.om * t + w.ph), 0);
const waterU = {
  uTime: { value: 0 }, uFogD: { value: 0.003 }, uFogN: { value: 1500 }, uFogF: { value: 40000 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uRain: { value: 1 }, uFogCol: { value: new THREE.Color() }, uDeep: { value: new THREE.Color(...(M.water.colour || [0.03, 0.06, 0.07])) },

};
const WATER_VS = `
uniform float uTime; uniform vec4 uWaveA[6]; uniform vec3 uWaveB[6]; uniform mat4 uTexMat;
varying vec3 vPos; varying vec2 vBase; varying vec4 vRefl;
void main(){

  for (int i = 0; i < 6; i++) { vec2 D = uWaveA[i].xy; float k = uWaveA[i].z, A = uWaveA[i].w, Q = uWaveB[i].y; float f = k * dot(D, w.xz) - uWaveB[i].x * uTime + uWaveB[i].z;

const WATER_FS = `
${SKY_GLSL}
uniform float uTime, uFogD, uFogN, uFogF, uRain; uniform vec3 uFogCol, uDeep, uSunDir, uSunCol; uniform sampler2D tRefl; uniform vec4 uWaveA[6]; uniform vec3 uWaveB[6];

float hn(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  vec2 g = rippleGrad(P.xz, fp) * 0.22;

const waterMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: WATER_VS, fragmentShader: WATER_FS, fog: false });
// water plane over the model's core area at its level (sea 0, lake surface); none for inland villages
const WE = M.water.extent, WL = M.water.level || 0, HAS_WATER = M.water.mode !== 'none';
const water = new THREE.Mesh(new THREE.PlaneGeometry(WE[2] - WE[0], WE[3] - WE[1], small ? 200 : 360, small ? 200 : 360).rotateX(-Math.PI / 2).translate((WE[0] + WE[2]) / 2, WL, -(WE[1] + WE[3]) / 2), waterMat);
water.visible = HAS_WATER; scene.add(water);
const farMat = waterMat.clone(); farMat.uniforms = { ...waterU, uWaveA: { value: WAVES.map(w => new THREE.Vector4(w.dx, w.dz, w.k, 0)) } };
if (M.water.mode === 'sea') scene.add(new THREE.Mesh(new THREE.PlaneGeometry(140000, 140000, 80, 80).rotateX(-Math.PI / 2).translate(0, -0.25, 0), farMat));

// ---------- rain ----------
const RN = small ? 12000 : 26000, rg = new THREE.BufferGeometry(), rp = new Float32Array(RN * 3), rs = new Float32Array(RN);

rg.setAttribute('position', new THREE.BufferAttribute(rp, 3)); rg.setAttribute('aSeed', new THREE.BufferAttribute(rs, 1));
const rainU = { uTime: { value: 0 }, uScale: { value: 800 }, uAmt: { value: 1 }, uFogN: { value: 600 }, uFogF: { value: 14000 } };
const rain = new THREE.Points(rg, new THREE.ShaderMaterial({
  uniforms: rainU, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,

  void main(){ vec3 p = position; float band = 20.0; p.y = floor(position.y / band) * band + mod(position.y - uTime * band * 5.0 / 15.0, band); p.x += p.y * 0.06;

    vA = step(aSeed, 0.5 * uAmt) * clamp(size / 6.0, 0.0, 1.0) * smoothstep(1.0, 4.0, -mv.z); vD = -mv.z;

// ---------- chimney smoke ----------
function puffTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(0.6, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const puffTex = puffTexture(), smokes = [], lamps = [], glass = new Map();

// ---------- model ----------
const loader = new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/'));
let rowboats = [];
m3dGet(M.file, 'buf').then(buf => loader.parse(buf, '', g => {
  const v = g.scene; scene.add(v);
  v.traverse(o => {
    if (/^lamp_/.test(o.name) && lamps.length < (small ? 6 : 12)) { const l = new THREE.PointLight(0xffb36b, 45, 30, 2); o.add(l); lamps.push(l); }
    if (o.isMesh) { o.castShadow = !/^terrain/.test(o.name); o.receiveShadow = true; }
    if (/^rowboat_/.test(o.name)) rowboats.push({ o, x: o.position.x, z: o.position.z, ry: o.rotation.y, ph: rnd() * TAU });
    if (o.isMesh && o.material && /^glass_(lit|dim)/.test(o.material.name) && !glass.has(o.material)) glass.set(o.material, o.material.emissiveIntensity);
  });
  v.updateMatrixWorld(true);
  v.traverse(o => {
    if (/^smoke_/.test(o.name) && smokes.length < (small ? 90 : 300)) {
      const base = new THREE.Vector3(); o.getWorldPosition(base);
      for (let i = 0; i < 6; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color: 0x9aa4b4, transparent: true, depthWrite: false, opacity: 0 })); s.userData = { base, k: i / 6, ph: rnd() }; smokes.push(s); scene.add(s); }
    }
  });
  applyMood(); $('load').hidden = true;
}, () => { $('loadTxt').textContent = T.fail; })).catch(() => { $('loadTxt').textContent = T.fail; });

// ---------- post ----------
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: small ? 0 : 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.5, 0.85); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- moods and controls ----------
const pmrem = new THREE.PMREMGenerator(renderer);
function applyMood() {
  skyU.uHorizon.value.setRGB(...mood.horizon); skyU.uZenith.value.setRGB(...mood.zenith); skyU.uGlow.value.setRGB(...mood.glow);
  const fc = new THREE.Color(...mood.horizon).multiplyScalar(0.85);
  scene.fog.color.copy(fc); scene.fog.near = mood.fogN; scene.fog.far = mood.fogF; waterU.uFogN.value = rainU.uFogN.value = mood.fogN; waterU.uFogF.value = rainU.uFogF.value = mood.fogF; waterU.uFogCol.value.copy(fc);
  sun.color.setRGB(...mood.sunCol); sun.intensity = mood.sunEl > 0 ? mood.sunI : 0; placeSun(); waterU.uSunDir.value.copy(sunDir); waterU.uSunCol.value.setRGB(...mood.sunCol).multiplyScalar(mood.sunEl > 0 ? mood.sunI : 0);
  hemi.intensity = mood.hemi; scene.environmentIntensity = mood.env; renderer.toneMappingExposure = mood.exposure;
  const r = rainOn ? mood.rain : 0; rainU.uAmt.value = r; waterU.uRain.value = r; rain.visible = r > 0;
  for (const l of lamps) l.intensity = 45 * mood.lamps;
  for (const [m, base] of glass) m.emissiveIntensity = base * mood.windows;   // lit windows fade by day
  const s = new THREE.Scene(); s.add(sky.clone()); if (scene.environment) scene.environment.dispose(); scene.environment = pmrem.fromScene(s, 0, 1, 30000).texture;
}
const moodsEl = $('moods');
for (const k of ['day', 'golden', 'dusk', 'night']) {
  const b = document.createElement('button'); b.textContent = T[k]; b.setAttribute('aria-pressed', MOODS[k] === mood);
  b.onclick = () => { mood = MOODS[k]; [...moodsEl.children].forEach(x => x.setAttribute('aria-pressed', x === b)); applyMood(); };
  moodsEl.appendChild(b);
}
$('rainBtn').onclick = e => { rainOn = !rainOn; e.target.setAttribute('aria-pressed', rainOn); applyMood(); };
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minDistance: 25, maxDistance: 2500, maxPolarAngle: Math.PI * 0.47, autoRotate: !reduceMotion, autoRotateSpeed: 0.35 });
const WX = M.water.extent, CORE_SIZE = Math.min(WX[2] - WX[0], WX[3] - WX[1]);
controls.maxDistance = Math.min(2500, Math.max(400, CORE_SIZE * 0.45));
controls.addEventListener('change', () => { const t = controls.target, m = 150;
  t.x = Math.min(WX[2] - m, Math.max(WX[0] + m, t.x)); t.z = Math.min(-WX[1] - m, Math.max(-WX[3] + m, t.z)); });
function resetView() { camera.position.set(...M.cam); controls.target.set(...M.target); controls.update(); }
$('resetBtn').onclick = resetView;
controls.addEventListener('start', () => { controls.autoRotate = false; });
addEventListener('keydown', e => { if (e.key === 'Escape' && parent !== window) parent.postMessage({ type: 'm3d-close' }, '*'); });

// ---------- loop ----------
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w, h);
  const pr = renderer.getPixelRatio(); reflRT.setSize(Math.round(w * pr / (small ? 3 : 2)), Math.round(h * pr / (small ? 3 : 2)));
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function renderReflection() {
  camera.updateMatrixWorld();
  if (!HAS_WATER) return;
  reflCam.position.set(camera.position.x, 2 * WL - camera.position.y, camera.position.z);
  camera.getWorldDirection(tmp); tmp2.copy(camera.position).add(tmp); tmp2.y = 2 * WL - tmp2.y;
  reflCam.up.set(0, 1, 0).applyQuaternion(camera.quaternion); reflCam.up.y = -reflCam.up.y;
  reflCam.lookAt(tmp2); reflCam.far = camera.far; reflCam.near = camera.near; reflCam.updateMatrixWorld(); reflCam.projectionMatrix.copy(camera.projectionMatrix);
  texMat.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
  clipUp[0].constant = -WL + 0.02;
  water.visible = false; rain.visible = false; sky.position.copy(reflCam.position);
  renderer.clippingPlanes = clipUp; renderer.setRenderTarget(reflRT); renderer.clear(); renderer.render(scene, reflCam);
  renderer.setRenderTarget(null); renderer.clippingPlanes = []; water.visible = true; rain.visible = rainU.uAmt.value > 0;
}
const t0 = performance.now();
function frame() {
  const t = ((performance.now() - t0) / 1000) % LOOP;
  controls.update();
  waterU.uTime.value = rainU.uTime.value = t;
  rain.position.set(controls.target.x, 0, controls.target.z);   // the rain volume follows what is being looked at
  rainU.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const r of rowboats) { const h = waveH(r.x, r.z, t); r.o.position.y = h * 0.9 + 0.02; r.o.rotation.z = Math.sin(TAU * t / LOOP * 2 + r.ph) * 0.04; }
  for (const s of smokes) {
    const d = s.userData, ph = ((2 * t / LOOP + d.k + d.ph * 0.07) % 1 + 1) % 1;
    s.position.set(d.base.x + ph * 3.5, d.base.y + ph * 9, d.base.z - ph * 1.2); const sc = 0.7 + ph * 3.2; s.scale.set(sc, sc, sc);
    s.material.opacity = Math.sin(Math.PI * Math.min(1, ph * 1.2)) * 0.42 * (1 - ph * 0.5);
  }
  placeSun(); renderReflection(); sky.position.copy(camera.position);
  composer.render();
  requestAnimationFrame(frame);
}
resize(); applyMood(); resetView(); requestAnimationFrame(frame);
window.m3d = { camera, controls, renderer, scene };
</script>
