<style>
:root{color-scheme:light dark;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--ring:rgba(11,11,11,.12);--accent:#2a78d6;--err:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--muted:#c3c2b7;--ring:rgba(255,255,255,.12);--accent:#3987e5;--err:#e66767}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--ring);border-radius:16px;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);font-size:14px;margin:0 0 18px}
input{width:100%;height:46px;border:1px solid var(--ring);border-radius:10px;padding:0 12px;font:inherit;background:transparent;color:inherit;letter-spacing:.04em}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}#msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--err)}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}label input{width:auto;height:auto}
.mark{display:block;width:44px;height:44px;margin:0 0 14px}
</style>
